<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<meta name="description" content="Pi、SoL-Pi 与 DGM 在五组公开数据集上的结果复用状态热力图；没有任何数据集同时具备三方可直接引用结果。">
<title>三方没有共同可直接复用基准·公平排名必须重跑</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#fff;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:6px}
  #c{width:100%;height:460px}
</style>
</head>
<body>
<div id="c"></div>
<script src="https://unpkg.byted-static.com/echarts/5.5.1/dist/echarts.min.js" integrity="sha384-Mx5lkUEQPM1pOJCwFtUICyX45KNojXbkWdYhkKUKsbv391mavbfoAmONbzkgYPzR" crossorigin="anonymous"></script>
<script>
  var chart = echarts.init(document.getElementById('c'), null, { renderer: 'svg' });

  var X = ['Pi','SoL-Pi','DGM'];
  var Y = [
    'EdgeBench（51 题）',
    'Terminal-Bench 4（CPU 63 题）',
    'SWE-bench Verified（DGM 200 题子集）',
    'Polyglot（完整 225 题）',
    'OpenBench（公开 4 题 fixture）'
  ];
  var STATUS = ['未公开','必须重跑','需条件对齐','可直接引用'];
  var DATA = [
    [0,0,3],[1,0,3],[2,0,0],
    [0,1,3],[1,1,3],[2,1,0],
    [0,2,0],[1,2,0],[2,2,2],
    [0,3,0],[1,3,0],[2,3,2],
    [0,4,1],[1,4,0],[2,4,0]
  ];

  chart.setOption({
    title: {
      text: '没有共同可直接复用基准·三方排名必须重跑',
      subtext: '状态针对已公开结果；“可直接引用”仅指可按原实验口径陈述，不代表可跨数据集公平排名',
      left:'center',
      textStyle:{fontSize:16,color:'#1f2d3d'},
      subtextStyle:{color:'#94a3b8',fontSize:11,lineHeight:16}
    },
    tooltip: {
      position:'top',
      formatter:function(p){
        return '<b>'+Y[p.value[1]]+' × '+X[p.value[0]]+'</b><br/>复用状态：'+STATUS[p.value[2]];
      }
    },
    grid: { left:238, right:28, top:92, bottom:88 },
    xAxis: {
      type:'category', data:X, splitArea:{show:true},
      axisLabel:{fontSize:13,color:'#334155'},
      axisLine:{lineStyle:{color:'#e8edf3'}},
      axisTick:{show:false}
    },
    yAxis: {
      type:'category', data:Y, inverse:true, splitArea:{show:true},
      axisLabel:{fontSize:12,color:'#334155',margin:12},
      axisLine:{lineStyle:{color:'#e8edf3'}},
      axisTick:{show:false}
    },
    visualMap: {
      type:'piecewise', orient:'horizontal', left:'center', bottom:10,
      itemWidth:18, itemHeight:12, itemGap:18,
      textStyle:{color:'#334155',fontSize:11},
      pieces:[
        {value:3,label:'可直接引用',color:'#10b981'},
        {value:2,label:'需条件对齐',color:'#f59e0b'},
        {value:1,label:'必须重跑',color:'#ef4444'},
        {value:0,label:'未公开',color:'#94a3b8'}
      ]
    },
    series: [{
      type:'heatmap', data:DATA,
      label:{
        show:true,
        color:'#fff',
        fontSize:11,
        fontWeight:600,
        formatter:function(p){return ['未公开','须重跑','需对齐','可引用'][p.value[2]];}
      },
      itemStyle:{borderColor:'#fff',borderWidth:3,borderRadius:5},
      emphasis:{itemStyle:{shadowBlur:8,shadowColor:'rgba(31,45,61,.3)'}}
    }]
  });
  window.addEventListener('resize', function(){ chart.resize(); });
</script>
</body>
</html>
